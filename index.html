<style>
/* Ashiri look: deep-emerald "coin" cards, pale mint ground, gold only for actions, floating pill navigation */
:root{
  --bg:#EBF1EE; --surface:#FFFFFF; --ink:#0C1E18; --muted:#58695F; --line:#D9E3DD; --soft:#F3F7F5;
  --brand:#0A6B4B; --brand-ink:#FFFFFF; --deep:#06372A; --deep-2:#0C5C42; --on-deep:#E8F5EE; --on-deep-2:rgba(232,245,238,.72);
  --gold:#F2B632; --gold-ink:#2A1D00;
  --yel:#6E5200; --yel-bg:#FFF0B3;
  --ok:#17794A; --ok-bg:#DDF2E6; --warn:#8F5600; --warn-bg:#FBEBC8; --bad:#B3261E; --bad-bg:#F9DEDA;
  --wheel-a:#0A6B4B; --wheel-b:#1F9A6D; --wheel-taken:#CBD6CF; --wheel-text:#FFFFFF; --wheel-text-taken:#7B887F;
  --mine:#0A6B4B; --mine-ink:#FFFFFF; --theirs:#E4ECE7;
  --shadow:0 1px 2px rgba(6,55,42,.05),0 12px 28px -18px rgba(6,55,42,.35);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Manrope','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07120E; --surface:#0F1D17; --ink:#E8F1EC; --muted:#97ACA1; --line:#1F332A; --soft:#0B1812;
  --brand:#3DBB86; --brand-ink:#04140C; --deep:#0D2E23; --deep-2:#15553E; --gold:#F2B632; --gold-ink:#2A1D00;
  --ok:#5DD39A; --ok-bg:#16382A; --warn:#F0B95A; --warn-bg:#3A2D10; --bad:#FF8E85; --bad-bg:#42201C;
  --wheel-a:#1B7A55; --wheel-b:#2DA472; --wheel-taken:#243830; --wheel-text:#FFFFFF; --wheel-text-taken:#6F8478;
  --yel:#F5D44E; --yel-bg:#3A3110; --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 30px -18px rgba(0,0,0,.7);
  --mine:#2DA472; --mine-ink:#04140C; --theirs:#1A2C23; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07120E; --surface:#0F1D17; --ink:#E8F1EC; --muted:#97ACA1; --line:#1F332A; --soft:#0B1812;
  --brand:#3DBB86; --brand-ink:#04140C; --deep:#0D2E23; --deep-2:#15553E; --gold:#F2B632; --gold-ink:#2A1D00;
  --ok:#5DD39A; --ok-bg:#16382A; --warn:#F0B95A; --warn-bg:#3A2D10; --bad:#FF8E85; --bad-bg:#42201C;
  --wheel-a:#1B7A55; --wheel-b:#2DA472; --wheel-taken:#243830; --wheel-text:#FFFFFF; --wheel-text-taken:#6F8478;
  --yel:#F5D44E; --yel-bg:#3A3110; --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 30px -18px rgba(0,0,0,.7);
  --mine:#2DA472; --mine-ink:#04140C; --theirs:#1A2C23; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;
  background-image:radial-gradient(900px 340px at 50% -120px,color-mix(in srgb,var(--brand) 16%,transparent),transparent);background-repeat:no-repeat;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.12;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(32px,8.4vw,48px);font-weight:800;letter-spacing:-.03em}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-top:0}
.wrap:has(.atabs){max-width:1000px}
.wrap:has(.atabs)>.grid2{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;margin:0 -16px;
  background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;min-width:0}
.mark{width:42px;height:42px;display:block;flex:none;filter:drop-shadow(0 6px 8px rgba(6,55,42,.28))}
.mark svg{width:100%;height:100%;display:block}
.brand b{display:flex;flex-direction:column;line-height:1.05}
.brand .w1{font-size:19px;font-weight:800;letter-spacing:.07em}
.brand .w2{font-size:10.5px;font-weight:700;letter-spacing:.09em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.card.hc{background:
  radial-gradient(circle at 104% -6%,transparent 0 70px,rgba(255,255,255,.07) 70px 71px,transparent 71px 104px,rgba(255,255,255,.06) 104px 105px,transparent 105px 140px,rgba(242,182,50,.16) 140px 141px,transparent 141px),
  linear-gradient(155deg,var(--deep-2),var(--deep));
  color:var(--on-deep);border:0;box-shadow:0 18px 36px -22px rgba(6,55,42,.8)}
.hc .muted,.hc .label,.hc .small{color:var(--on-deep-2)}
.hc .big,.hc .hbig{color:#fff}
.hbig{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:13px;color:var(--muted);font-weight:600}
.big{font-family:var(--font-display);font-size:34px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--brand);color:var(--brand-ink);min-height:46px;transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.98)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 14px;min-height:36px;font-size:13px;border-radius:12px}
.btn.bad{background:var(--bad-bg);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:13px}
input,select,textarea{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:11px 14px;min-height:46px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
textarea{resize:vertical;min-height:96px}
.err{background:var(--bad-bg);color:var(--bad);padding:12px 14px;border-radius:14px;font-size:14px;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px;gap:4px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;padding:11px;border-radius:99px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--deep);color:#fff}
.hero{display:flex;flex-direction:column;gap:12px;padding:14px 0 6px}
.hero p{max-width:52ch;font-size:16px}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700}
.pill.pending{background:var(--warn-bg);color:var(--warn)}
.pill.confirmed{background:var(--ok-bg);color:var(--ok)}
.pill.rejected{background:var(--bad-bg);color:var(--bad)}
.pill.green{background:var(--ok-bg);color:var(--ok)}
.pill.yellow{background:var(--yel-bg);color:var(--yel)}
.pill.red{background:var(--bad-bg);color:var(--bad)}
.pill.grey{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.dotc{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none}
.dotc.g{background:#1E9E5F}.dotc.y{background:#F2C21B}.dotc.r{background:#D93A30}.dotc.n{background:var(--line)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.legend span{display:flex;gap:8px;align-items:center}
.trk{overflow-x:auto}
.trk table{border-collapse:collapse;min-width:100%;font-size:13px}
.trk th,.trk td{padding:9px 10px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
.trk th{font-weight:700;border-top:0}
.trk th:first-child,.trk td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
.trk td div{display:flex;flex-direction:column;align-items:center;gap:2px}
.acct{display:flex;flex-direction:column;gap:2px;background:var(--soft);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:16px;padding:14px 16px}
.acct .num{font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:.05em;font-variant-numeric:tabular-nums;word-break:break-all}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item>div{min-width:0}
.item .amt{font-family:var(--font-display);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.tabs .in{pointer-events:auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%;max-width:400px;gap:4px;padding:6px;border-radius:99px;
  background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 16px 34px -14px rgba(6,55,42,.55)}
.tabs button{border:0;background:transparent;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;border-radius:99px;position:relative}
.tabs button.on{color:#fff;background:var(--deep)}
.tabs svg{width:21px;height:21px}
.dot{position:absolute;top:2px;right:calc(50% - 20px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--gold);color:var(--gold-ink);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 22px -6px rgba(120,80,0,.55);z-index:25}
.fab svg{width:25px;height:25px}
.fab .dot{top:-2px;right:-2px}
.sheet{position:fixed;inset:0;background:rgba(3,14,10,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);width:100%;max-width:680px;height:min(86%,660px);border-radius:28px 28px 0 0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.thread{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.b{max-width:82%;padding:10px 14px;border-radius:18px;display:flex;flex-direction:column;gap:4px;word-break:break-word}
.b.mine{align-self:flex-end;background:var(--mine);color:var(--mine-ink);border-bottom-right-radius:5px}
.b.theirs{align-self:flex-start;background:var(--theirs);border-bottom-left-radius:5px}
.b time{font-size:11px;opacity:.75}
.b audio{max-width:100%;height:36px}
.fab.guide{bottom:calc(160px + env(safe-area-inset-bottom,0px));background:#0B5A41;color:#fff;font:800 26px/1 inherit;box-shadow:0 10px 22px -6px rgba(0,40,25,.55)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;border-top:1px solid var(--line);flex:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:inherit;border-radius:999px;padding:9px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.composer{display:flex;flex-direction:row;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--surface);align-items:center}
.composer input{flex:1;min-width:0;border-radius:99px}
.ib{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--soft);display:grid;place-items:center;cursor:pointer;flex:none}
.ib svg{width:20px;height:20px}
.ib.rec{background:var(--bad);color:#fff;border-color:var(--bad)}
.ib.send{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.wheelbox{position:relative;width:min(100%,340px);aspect-ratio:1;margin:8px auto}
.wheelbox canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 0 6px var(--gold),0 0 0 9px var(--deep),0 18px 34px -12px rgba(6,55,42,.6)}
.pointer{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid var(--bad);z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.hub{position:absolute;left:50%;top:50%;width:66px;height:66px;transform:translate(-50%,-50%);border-radius:50%;background:var(--deep);color:#fff;border:4px solid var(--gold);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:13px;z-index:2}
.result{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.result .no{font-family:var(--font-display);font-size:68px;font-weight:800;line-height:1;color:var(--brand)}
.stat{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.card .stat{box-shadow:none;background:var(--soft)}
.atabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.atabs button{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:99px;font-weight:700;cursor:pointer;white-space:nowrap;position:relative;color:var(--muted)}
.atabs button.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));background:var(--deep);color:#fff;padding:11px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:60;max-width:90%;text-align:center;box-shadow:0 12px 26px -10px rgba(0,0,0,.6)}
.empty{color:var(--muted);text-align:center;padding:20px 8px}
.notice{background:var(--warn-bg);color:var(--warn);padding:12px 14px;border-radius:16px;font-size:14px;font-weight:600}
a.link{color:var(--brand);font-weight:700;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.modal{position:fixed;inset:0;background:rgba(3,14,10,.6);z-index:70;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:28px;padding:24px;max-width:430px;width:100%;display:flex;flex-direction:column;gap:12px;border-top:6px solid var(--gold);max-height:85%;overflow-y:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.banner{max-width:680px;margin:12px auto 0}
.bar{height:12px;border-radius:99px;background:var(--soft);border:1px solid var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%;animation:grow .9s ease}
.bar .conf{background:linear-gradient(90deg,var(--brand),#5FD3A0)}
.bar .pend{background:var(--gold)}
@keyframes grow{from{width:0}}
.foot{max-width:680px;margin:24px auto 0;text-align:center;font-size:12px;color:var(--muted)}
.rchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.rc{min-width:32px;height:32px;padding:0 7px;border-radius:99px;display:inline-grid;place-items:center;font-size:12px;font-weight:800;background:var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.rc.g{background:var(--ok);color:#fff}.rc.y{background:#F2C21B;color:#2a2000}.rc.r{background:var(--bad);color:#fff}
.rc.p{background:transparent;color:var(--ink);outline:2px dashed var(--muted);outline-offset:-3px}
.rc.past{background:var(--muted);color:var(--bg)}
.rc.cur{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--brand)}

function authMsg(er,admin){
  var c=(er&&er.code)||'';
  if(c==='auth/email-already-in-use')return 'This phone number is already registered. Please log in.';
  if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-email')return admin?'Email or password is not correct.':'Phone number or PIN is not correct.';
  if(c==='auth/too-many-requests')return 'Too many tries. Please wait a few minutes and try again.';
  if(c==='auth/network-request-failed')return 'No internet connection. Please try again.';
  if(c==='permission-denied')return 'The database rules are not published yet. Please tell the admin.';
  return 'Something went wrong ('+(c||'unknown')+'). Please try again.';

    return d.data().uid===u.uid;
  }).catch(function(er){

function startUser(u,admin){
  stopAll(unsubUser);db.members=[];db.payments=[];db.messages=[];db.payouts=[];db.spots={};db.mspots={};
  db.session=admin?{role:'admin'}:{role:'member',memberId:u.uid};
  var C=function(n){return fs.collection(n)};
  var listen=function(ref,fn){unsubUser.push(ref.onSnapshot(function(q){fn(q);softRender()},onErr))};
  if(admin){
    if(ui.settingsMissing)pushSettings();
    listen(C('members'),function(q){db.members=q.docs.map(normDoc)});
    listen(C('payments'),function(q){db.payments=q.docs.map(normDoc)});
    listen(C('messages'),function(q){db.messages=q.docs.map(normDoc)});
    listen(C('payouts'),function(q){db.payouts=q.docs.map(normDoc)});
  }else{
    listen(C('members').doc(u.uid),function(d){db.members=d.exists?[normDoc(d)]:[]});
    listen(C('payments').where('mid','==',u.uid),function(q){db.payments=q.docs.map(normDoc)});
    listen(C('messages').where('mid','==',u.uid),function(q){db.messages=q.docs.map(normDoc)});
    listen(C('payouts').where('mid','==',u.uid),function(q){db.payouts=q.docs.map(normDoc)});
  }
  listen(C('spots'),function(q){var o={};q.forEach(function(d){o[d.id]=d.data().holders||[]});db.spots=o});
  listen(C('mspots'),function(q){var o={};q.forEach(function(d){o[d.id]=d.data().holders||[]});db.mspots=o});
}
