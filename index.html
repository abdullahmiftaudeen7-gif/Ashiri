/* ---------- wheel ---------- */
function drawWheel(){
  var cv=$('#wheel');if(!cv)return;
  var nums=wheelNumbers(),n=nums.length,tk=(me()?takenFor(me()):takenPositions()),c=cv.getContext('2d'),S=cv.width,r=S/2;
  var cs=getComputedStyle(document.documentElement),g=function(k){return cs.getPropertyValue(k).trim()||'#888'};
  var A=g('--wheel-a'),B=g('--wheel-b'),T=g('--wheel-taken'),X=g('--wheel-text'),XT=g('--wheel-text-taken');
  c.clearRect(0,0,S,S);var seg=2*Math.PI/n;
  for(var i=0;i<n;i++){
    var st=-Math.PI/2+i*seg,taken=!!tk[nums[i]];
    c.beginPath();c.moveTo(r,r);c.arc(r,r,r,st,st+seg);c.closePath();c.fillStyle=taken?T:(i%2?B:A);c.fill();
    c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=3;c.stroke();
    c.save();c.translate(r,r);c.rotate(st+seg/2);c.textAlign='right';c.textBaseline='middle';
    c.fillStyle=taken?XT:X;c.font='800 '+Math.max(20,Math.min(54,Math.floor(S/(n>12?(n/1.15):9))))+'px "Bricolage Grotesque",system-ui,sans-serif';
    c.fillText(String(nums[i]),r-24,0);c.restore();
  }
}
function cloudSpin(m,pos){
  var sref=fs.collection('spots').doc(String(pos)),mref=fs.collection('members').doc(m.id),setr=fs.doc('settings/main'),at=Date.now();
  return fs.runTransaction(function(t){
    return Promise.all([t.get(sref),t.get(mref),t.get(setr)]).then(function(r){
      var hs=(r[0].exists&&r[0].data().holders)||[],mem=r[1].data()||{},st=r[2].data()||{};
      if(!st.spinOpen)throw 'closed';
      var cap=Math.max(1,((st.payouts||{})[pos]||{}).ppl||1);
      if(hs.indexOf(m.id)>-1||hs.length>=cap)throw 'taken';
      var sp=mem.spins||[];
      if(sp.length>=Math.max(1,Math.floor((mem.amount||0)/5000)))throw 'nospin';
      t.set(sref,{holders:hs.concat([m.id])});
      t.update(mref,{spins:sp.concat([{pos:pos,at:at}])});
    });
  }).then(function(){
    var c=memberById(m.id);if(c&&!(c.spins||[]).some(function(x){return x.pos===pos}))c.spins=(c.spins||[]).concat([{pos:pos,at:at}]);
    var a=db.spots[pos]||[];if(a.indexOf(m.id)<0)db.spots[pos]=a.concat([m.id]);
  });
}
function doSpin(){
  var m=me();if(!m||ui.spinning||spinsLeft(m)<1)return;
  if(!db.settings.spinOpen){toast('Spinning is not open yet.');return}
  var nums=wheelNumbers(),tk=takenFor(m),free=nums.filter(function(x){return !tk[x]});
  if(!free.length){toast('All numbers are taken.');return}
  var pos=free[rand(free.length)],n=nums.length,seg=360/n,k=nums.indexOf(pos);
  var jitter=(Math.random()-.5)*seg*.6,theta=360*(5+rand(3))-(k+.5)*seg+jitter;
  var cv=$('#wheel');ui.spinning=true;var b=$('#spinbtn');if(b)b.disabled=true;
  cv.style.transition='transform 6s cubic-bezier(.12,.6,.12,1)';
  requestAnimationFrame(function(){cv.style.transform='rotate('+theta+'deg)'});
  var commit=CLOUD?cloudSpin(m,pos):Promise.resolve();
  var wait=new Promise(function(r){setTimeout(r,6200)});
  Promise.all([commit.then(function(){return null},function(e){console.error(e);return (e&&e.code)?e.code:(e||'fail')}),wait]).then(function(r){
    var err=r[0];
    if(err){ui.spinning=false;toast(err==='closed'?'Spinning was just closed by the admin.':err==='nospin'?'You have no spins left.':err==='taken'?'That number was just taken. Spin again.':err==='permission-denied'?'Spin blocked by the database rules. Admin: republish the rules.':err==='unavailable'||err==='network-request-failed'?'No internet. Please try again.':'Spin could not be saved ('+err+'). Please try again.');render();return}
    if(!CLOUD){
      var cur=memberById(m.id),again=takenFor(cur);
      if(again[pos]||spinsLeft(cur)<1){ui.spinning=false;toast('That number was just taken. Spin again.');render();return}
      cur.spins=cur.spins||[];cur.spins.push({pos:pos,at:Date.now()});save();
    }
    ui.spinning=false;render();
  });
}

function blobToMsg(blob){
  if(blob.size>(CLOUD?600000:1500000)){toast('Voice note is too long. Keep it under about one minute.');return}
  var fr=new FileReader();fr.onload=function(){postMsg('',fr.result)};fr.readAsDataURL(blob);
}
function toggleRec(){
  if(rec){try{rec.stop()}catch(e){}return}
  var fallback=function(){toast('Recording is not allowed here. Choose a voice note from your phone instead.');var f=$('#audioFile');if(f)f.click()};
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){fallback();return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    var mr;try{mr=new MediaRecorder(st,{audioBitsPerSecond:24000})}catch(e){mr=new MediaRecorder(st)}var ch=[];
    mr.ondataavailable=function(e){if(e.data.size)ch.push(e.data)};
    mr.onstop=function(){st.getTracks().forEach(function(t){t.stop()});clearTimeout(recTimer);rec=null;ui.recording=false;blobToMsg(new Blob(ch,{type:mr.mimeType||'audio/webm'}))};
    mr.start();rec=mr;ui.recording=true;recTimer=setTimeout(function(){try{mr.stop()}catch(e){}},60000);render();
  }).catch(fallback);
}

}

document.addEventListener('change',function(e){if(e.target.id==='p-due'){var m0=me();if(m0){var r0=m0.amount-paidSum(m0.id,e.target.value,false);$('#p-amt').value=r0>0?r0:m0.amount}payHint()}
  if(e.target.id==='audioFile'&&e.target.files[0]){blobToMsg(e.target.files[0]);e.target.value=''}});
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  if(t.classList.contains('sheet')&&e.target.closest('[data-stop]'))return;
  var a=t.dataset.act,v=t.dataset.v,id=t.dataset.id;
  if(a==='auth'){ui.auth=v;ui.err='';if((location.hash||'').toLowerCase()==='#admin'){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}render()}
  else if(a==='adminlogin'){ui.auth='admin';ui.err='';render()}
  else if(a==='logout'){ui.chat=false;ui.auth=((location.hash||'').toLowerCase()==='#admin')?'admin':'login';ui.err='';ui.thread=null;ui.tab='home';if(CLOUD){fauth.signOut();return}db.session=null;save();render()}
  else if(a==='tab'){ui.tab=v;render()}
  else if(a==='atab'){ui.atab=v;ui.thread=null;render()}
  else if(a==='fillall'){var fa=$('#fill-a').value,fp=$('#fill-p').value;for(var z=1;z<=db.settings.slots;z++){var ea=$('#po-a-'+z),ep=$('#po-p-'+z);if(ea&&fa)ea.value=fa.replace(/\D/g,'');if(ep&&fp)ep.value=fp.replace(/\D/g,'')}}
  else if(a==='release'){var rm=memberById(id);if(rm){updMember(rm.id,{released:!rm.released});render()}}
  else if(a==='payfill'){ui.payPick=v;ui.holdOk=false;render();var pa=$('#po-amt');if(pa)pa.focus()}
  else if(a==='delpayout'){if(CLOUD){fs.collection('payouts').doc(id).delete().catch(function(){toast('Could not undo.')})}else{db.payouts=db.payouts.filter(function(x){return x.id!==id});save();render()}toast('Payout removed')}
  else if(a==='seen'){markSeen(Number(id));render()}
  else if(a==='togglespin'){db.settings.spinOpen=!db.settings.spinOpen;pushSettings();render();toast(db.settings.spinOpen?'Spinning is now open':'Spinning is now closed')}
  else if(a==='delnotice'){delNotice(id)}
  else if(a==='editacct'){ui.editAcct=!ui.editAcct;render()}
  else if(a==='spin'){doSpin()}
  else if(a==='openchat'){ui.chat=true;render()}
  else if(a==='closechat'){ui.chat=false;render()}
  else if(a==='openthread'){ui.thread=id;render()}
  else if(a==='closethread'){ui.thread=null;render()}
  else if(a==='mic'){toggleRec()}
  else if(a==='copy'){var n=db.settings.opayNumber;
    (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(n):Promise.reject()).then(function(){toast('Account number copied')},function(){var el=$('#acctnum');if(el){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r)}toast('Number selected. Press and hold to copy.')})}
  else if(a==='confirm'||a==='reject'){var p=db.payments.filter(function(x){return x.id===id})[0];if(p){var stt=a==='confirm'?'confirmed':'rejected';if(CLOUD){fs.collection('payments').doc(id).update({status:stt,cat:ts()}).catch(function(){toast('Could not update. Check your internet.')});return}p.status=stt;p.cat=Date.now();save();render()}}
  else if(a==='resetspin'){var mm=memberById(id);if(mm){
    if(CLOUD){var bt=fs.batch();mSpins(mm).forEach(function(x){bt.update(fs.collection('spots').doc(String(x.pos)),{holders:firebase.firestore.FieldValue.arrayRemove(mm.id)})});bt.update(fs.collection('members').doc(mm.id),{spins:[]});bt.commit().then(function(){toast('Spins reset for '+mm.name)},function(){toast('Could not reset. Check your internet.')});return}
    mm.spins=[];save();render();toast('Spins reset for '+mm.name)}}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  var k=f.dataset.form,g=function(n){var el=f.elements[n];return el?el.value.trim():''};
  if(k==='register'){
    var phone=normPhone(g('phone')),pin=g('pin');
    if(!validPhone(phone)){ui.err='Enter a valid Nigerian phone number, like 08012345678.';render();return}
    if(!/^\d{6}$/.test(pin)){ui.err='PIN must be exactly 6 digits.';render();return}
    var acno=g('acno').replace(/\s/g,'');
    if(!/^\d{10}$/.test(acno)){ui.err='Account number must be 10 digits.';render();return}
    if(!g('bank')||!g('acname')){ui.err='Choose your bank and enter the account name.';render();return}
    var prof={name:g('name'),location:g('loc'),phone:phone,amount:Number(g('amt')),payout:{bank:g('bank'),number:acno,name:g('acname')}};
    if(CLOUD){
      var btn=f.querySelector('button[type=submit]');if(btn)btn.disabled=true;
      var cu=null;
      fauth.createUserWithEmailAndPassword(phone+MEMBER_DOMAIN,pin).then(function(c){
        cu=c.user;
        return fs.collection('members').doc(c.user.uid).set({name:prof.name,location:prof.location,phone:prof.phone,amount:prof.amount,created:ts(),spins:[],released:false,payout:prof.payout});
      }).then(function(){ui.err='';ui.tab='home';toast('Welcome, '+prof.name.split(' ')[0]+'.')}).catch(function(er){
        if(cu){cu.delete().catch(function(){});}
        if(er&&er.code==='auth/email-already-in-use')ui.auth='login';
        ui.err=authMsg(er);ui.booting=false;render();
      });
      return;
    }
    if(db.members.some(function(m){return m.phone===phone})){ui.err='This phone number is already registered. Please log in.';ui.auth='login';render();return}
    var m={id:uid(),name:prof.name,location:prof.location,phone:phone,amount:prof.amount,pin:pin,created:Date.now(),spins:[],payout:prof.payout};
    db.members.push(m);db.session={role:'member',memberId:m.id};save();ui.err='';ui.tab='home';render();toast('Welcome, '+m.name.split(' ')[0]+'.');
  }else if(k==='login'){
    var ph=normPhone(g('phone')),lpin=g('pin');
    if(CLOUD){fauth.signInWithEmailAndPassword(ph+MEMBER_DOMAIN,lpin).then(function(){ui.err='';ui.tab='home'}).catch(function(er){ui.err=authMsg(er);render()});return}
    var mb=db.members.filter(function(x){return x.phone===ph&&x.pin===lpin})[0];
    if(!mb){ui.err='Phone number or PIN is not correct.';render();return}
    db.session={role:'member',memberId:mb.id};save();ui.err='';ui.tab='home';render();
  }else if(k==='admin'){
    if(CLOUD){
      fauth.signInWithEmailAndPassword(g('email'),g('pw')).then(function(c){
        if(!ADMIN_EMAIL||c.user.email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){ui.err='This account is not the admin.';fauth.signOut();render()}
        else{ui.err='';ui.atab='overview'}
      }).catch(function(er){ui.err=authMsg(er,true);render()});
      return;
    }
    if(g('pin')!==db.settings.adminPin){ui.err='Wrong admin PIN.';render();return}
    db.session={role:'admin'};save();ui.err='';ui.atab='overview';render();
  }else if(k==='payout'){
    var ac=g('acno').replace(/\s/g,'');
    if(!/^\d{10}$/.test(ac)){toast('Account number must be 10 digits.');return}
    if(!g('bank')||!g('acname')){toast('Choose your bank and enter the account name.');return}
    updMember(me().id,{payout:{bank:g('bank'),number:ac,name:g('acname')}});ui.editAcct=false;render();toast('Payout account saved');
  }else if(k==='pay'){
    var pamt=parseInt(($('#p-amt').value||'').replace(/\D/g,''),10)||0;if(pamt<1||pamt>10000000){toast('Enter the amount you sent.');return}
    var m2=me(),pd={mid:m2.id,amount:pamt,ref:$('#p-ref').value.trim(),status:'pending',cat:null,due:$('#p-due').value};
    if(CLOUD){pd.at=ts();fs.collection('payments').add(pd).catch(function(){toast('Payment not saved. Check your internet and try again.')})}
    else{pd.id=uid();pd.at=Date.now();db.payments.push(pd);save()}
    ui.tab='history';render();toast('Payment recorded. The admin will confirm it.');
  }else if(k==='send'){
    var txt=($('#msg').value||'').trim();if(!txt)return;postMsg(txt,'');
    setTimeout(function(){var i=$('#msg');if(i)i.focus()},0);
  }else if(k==='notice'){
    var nt=($('#n-text').value||'').trim(),ntl=($('#n-title').value||'').trim();if(!nt)return;
    var nobj={title:ntl,text:nt};
    if(CLOUD){nobj.at=ts();fs.collection('notices').add(nobj).then(function(){toast('Notice posted')},function(){toast('Could not post. Check your internet.')});$('#n-text').value='';$('#n-title').value=''}
    else{nobj.id=uid();nobj.at=Date.now();db.notices.push(nobj);save();render();toast('Notice posted')}
  }else if(k==='paidout'){
    var pk=($('#po-pick').value||'').split('|'),prow=payoutRows().filter(function(r){return r.m.id===pk[0]&&String(r.pos)===pk[1]})[0];
    var pv=parseInt(($('#po-amt').value||'').replace(/\D/g,''),10)||0;
    if(!prow||pv<1){toast('Enter the amount you paid.');return}
    if(pv>prow.left){toast('That is more than the balance ('+naira(prow.left)+').');return}
    if(onHold(prow.m)&&!ui.holdOk){ui.holdOk=true;toast(prow.m.name+' has red, so payout is on hold. Press Record payout again to pay anyway.');return}
    ui.holdOk=false;ui.payPick='';
    var po0={mid:prow.m.id,pos:prow.pos,amount:pv,note:($('#po-note').value||'').trim()};
    if(CLOUD){po0.at=ts();fs.collection('payouts').add(po0).then(function(){toast('Payout recorded')},function(){toast('Could not save. Check your internet.')})}
    else{po0.id=uid();po0.at=Date.now();db.payouts.push(po0);save();render();toast('Payout recorded')}
  }else if(k==='payouts'){
    var po2={},bad=0;for(var q=1;q<=db.settings.slots;q++){var am=parseInt(($('#po-a-'+q).value||'').replace(/\D/g,''),10)||0,pp=parseInt(($('#po-p-'+q).value||'').replace(/\D/g,''),10)||0;var hh=holders()[q];if(hh&&hh.length>(pp||1)){bad=q;break}if(am||pp)po2[q]={amt:am,ppl:pp||1}}
    if(bad){toast('Number '+bad+' already has '+holders()[bad].length+' people on it, so it cannot be shared by fewer.');return}db.settings.payouts=po2;pushSettings();render();toast('Payouts saved');
  }else if(k==='settings'){
    var s=db.settings,slots=Math.max(2,Math.min(100,parseInt($('#s-slots').value,10)||s.slots));
    var taken=Object.keys(holders()).map(Number),mx=taken.length?Math.max.apply(null,taken):0;
    if(slots<mx){toast('Some members already hold number '+mx+'. Reset their spins first.');return}
    var bl=[];$('#s-block').value.split(/[^0-9]+/).forEach(function(x){var v=parseInt(x,10);if(v>=1&&v<=slots&&bl.indexOf(v)<0)bl.push(v)});bl.sort(function(a,b){return a-b});
    var tkn=holders(),clash=bl.filter(function(v){return tkn[v]});
    if(clash.length){toast('Number '+clash[0]+' is already taken by a member, so it cannot be blocked.');return}
    var stv=$('#s-start').value||s.start,rv=Math.max(1,Math.min(200,parseInt($('#s-rounds').value,10)||s.rounds||31));
    if(!validDue(stv)){toast('The start date must be a 10th, 20th or 30th.');return}
    var unitv=parseInt(($('#s-unit').value||'').replace(/\D/g,''),10)||s.unitPayout||150000;
    s.blocked=bl;
    s.group=$('#s-group').value.trim();s.opayName=$('#s-on').value.trim();s.opayNumber=$('#s-num').value.trim();s.slots=slots;s.cycle=$('#s-cycle').value;s.start=stv;s.rounds=rv;s.end=endKey();s.unitPayout=unitv;
    if(!CLOUD)s.adminPin=$('#s-pin').value.trim()||s.adminPin;
    pushSettings();render();toast('Settings saved');
  }
});
window.addEventListener('storage',function(e){if(!CLOUD&&e.key===KEY&&!ui.recording&&!ui.spinning&&document.activeElement.tagName!=='INPUT'){db=load();render()}});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',drawWheel);
